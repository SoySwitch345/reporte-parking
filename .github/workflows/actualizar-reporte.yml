name: Actualizar reporte de parking

on:
  schedule:
    # Cada hora, las 24 horas (el parking opera 24/7). Antes corria 1 vez al
    # dia (11:00 UTC) pero GitHub Actions no garantiza el horario exacto de
    # un cron - se vio atrasarse hasta 6h y hasta saltarse un dia completo
    # (2026-09-23). Correr cada hora no arregla esa falta de garantia, pero
    # reduce la ventana de exposicion: si una hora falla, la siguiente (si
    # dispara) se autocorrige via la reconciliacion de 5 dias. El script usa
    # zoneinfo America/Santiago para todos los calculos de fecha, asi que el
    # horario exacto de ejecucion no afecta los numeros del reporte.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-reporte
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Actualizar pagos y regenerar reporte
        env:
          PARKINGAPP_EMAIL: ${{ secrets.PARKINGAPP_EMAIL }}
          PARKINGAPP_PASSWORD: ${{ secrets.PARKINGAPP_PASSWORD }}
        run: python scripts/actualizar_reporte.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pagos.json index.html
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Actualizar reporte $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
