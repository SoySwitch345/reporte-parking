name: Actualizar reporte de parking

on:
  # Sin trigger "schedule" nativo a proposito (2026-09-23): se probo primero
  # 1x/dia y despues cada hora, y en ambos casos GitHub Actions se salto
  # disparos por completo (no solo atrasos) - no es confiable para este
  # repo. El disparo automatico real es externo: un cron job en
  # cron-job.org llama a la API de dispatch de este workflow cada hora
  # (POST a /actions/workflows/actualizar-reporte.yml/dispatches con un
  # token fine-grained scoped solo a Actions:write de este repo). Se quito
  # el schedule nativo en vez de dejarlo como respaldo para no duplicar el
  # trafico de login contra ParkingApp (ya es scraping, no API oficial, sin
  # limites de rate documentados - mejor no arriesgar un bloqueo/captcha).
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-reporte
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Actualizar pagos y regenerar reporte
        env:
          PARKINGAPP_EMAIL: ${{ secrets.PARKINGAPP_EMAIL }}
          PARKINGAPP_PASSWORD: ${{ secrets.PARKINGAPP_PASSWORD }}
        run: python scripts/actualizar_reporte.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pagos.json index.html
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Actualizar reporte $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
