function fmtCLP(n){return '$' + Math.round(n).toLocaleString('es-CL');}
function fmtPct(n){var s=(n*100).toFixed(1)+'%'; return (n>=0?'+':'')+s;}
function renderMensual(){
  var tb = document.getElementById('tbodyMensual');
  monthly.forEach(function(m, i){
    if(m.transacciones === 0 && i > new Date().getMonth()) return;
    var claseT = m.deltaTdia >= 0 ? 'pos' : 'neg';
    var claseM = m.deltaMontoTransac >= 0 ? 'pos' : 'neg';
    var deltaTStr = i===0 ? '-' : fmtPct(m.deltaTdia);
    var deltaMStr = i===0 ? '-' : fmtPct(m.deltaMontoTransac);
    tb.innerHTML += '<tr><td>'+m.nombre+'</td><td>'+fmtCLP(m.cobrado)+'</td><td>'+m.transacciones+
      '</td><td>'+m.tdia.toFixed(1)+'</td><td>'+fmtCLP(m.montoTransac)+
      '</td><td class='+claseT+'>'+deltaTStr+
      '</td><td class='+claseM+'>'+deltaMStr+'</td></tr>';
  });
}
function renderDiario(filtro){
  var tb = document.getElementById('tbodyDiario');
  tb.innerHTML = '';
  daily.filter(function(d){ return !filtro || d.fecha.indexOf(filtro) !== -1; })
    .forEach(function(d){
      tb.innerHTML += '<tr><td>'+d.fecha+'</td><td>'+d.dia+'</td><td>'+fmtCLP(d.monto)+
        '</td><td>'+d.transacciones+'</td><td>'+fmtCLP(d.montoTransac)+'</td></tr>';
    });
}
function poblarSelectMes(){
  var sel = document.getElementById('selectMes');
  var mesesConDatos = [...new Set(daily.map(function(d){return d.mes;}))].sort(function(a,b){return a-b;});
  mesesConDatos.forEach(function(m){
    var opt = document.createElement('option');
    opt.value = m;
    opt.textContent = monthly[m-1].nombre;
    sel.appendChild(opt);
  });
  if(mesesConDatos.length > 0) sel.value = mesesConDatos[mesesConDatos.length-1];
  sel.addEventListener('change', function(){ renderDiaSemana(parseInt(sel.value)); });
  renderDiaSemana(parseInt(sel.value));
}
function renderDiaSemana(mes){
  var dias = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
  var agg = {};
  dias.forEach(function(d){ agg[d] = {monto:0, trans:0, count:0}; });
  daily.filter(function(d){ return d.mes === mes; }).forEach(function(d){
    agg[d.dia].monto += d.monto; agg[d.dia].trans += d.transacciones; agg[d.dia].count++;
  });
  var tb = document.getElementById('tbodyDiaSemana');
  tb.innerHTML = '';
  dias.forEach(function(d){
    var a = agg[d];
    var promMonto = a.count > 0 ? a.monto / a.count : 0;
    var promTrans = a.count > 0 ? a.trans / a.count : 0;
    var promMT = a.trans > 0 ? a.monto / a.trans : 0;
    tb.innerHTML += '<tr><td>'+d+'</td><td>'+fmtCLP(promMonto)+'</td><td>'+promTrans.toFixed(1)+
      '</td><td>'+fmtCLP(promMT)+'</td></tr>';
  });
}
document.getElementById('buscar').addEventListener('input', function(e){ renderDiario(e.target.value); });
renderMensual();
renderDiario('');
poblarSelectMes();
